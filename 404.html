<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Google Fonts & Font Awesome 6 Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --surface-glass: rgba(255, 255, 255, 0.95);
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #d4a373;
            --accent-hover: #b07d4f;
            --accent-glow: rgba(212, 163, 115, 0.3);
            --border-light: rgba(15, 23, 42, 0.12);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Outfit', sans-serif;
        }

        body.dark-mode {
            --bg-primary: #0d1117;
            --bg-secondary: #131923;
            --surface-glass: rgba(19, 25, 35, 0.95);
            --card-bg: #1a2230;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            padding: 2rem 1rem;
        }

        /* Ambient background decoration */
        .bg-decor {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -150px;
            left: -150px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-decor-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(176, 125, 79, 0.2) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            pointer-events: none;
            z-index: 0;
        }

        /* TOP RIGHT FLOATING CONTROLS (OUTSIDE CARD) */
        .top-controls {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        body[dir="rtl"] .top-controls {
            right: auto;
            left: 2rem;
        }

        .ctrl-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1;
            height: 36px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(12px);
        }

        .ctrl-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* 404 CONTAINER CARD */
        .error-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transition: var(--transition-smooth);
            margin: 0 auto;
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .logo-knight {
            font-size: 2.3rem;
            color: var(--accent);
        }

        .logo-title {
            font-family: var(--font-heading);
            font-weight: 900;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a06834 0%, #d4a373 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .logo-sub {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 2.8px;
            display: block;
        }

        /* CHESS 404 ILLUSTRATION BADGE */
        .error-illustration {
            margin: 0 auto 1.75rem auto;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(212, 163, 115, 0.12);
            border: 2px dashed var(--accent);
        }

        .error-illustration .fallen-king {
            font-size: 4rem;
            color: var(--accent);
            transform: rotate(30deg);
            filter: drop-shadow(0 4px 12px var(--accent-glow));
            transition: var(--transition-smooth);
        }

        .error-illustration:hover .fallen-king {
            transform: rotate(0deg) scale(1.1);
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 163, 115, 0.15);
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(212, 163, 115, 0.3);
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }

        .error-subtitle {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 2.2rem;
        }

        /* BUTTON ACTIONS */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn-action-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.9rem 1.6rem;
            border-radius: 14px;
            text-decoration: none;
            transition: var(--transition-smooth);
            box-shadow: 0 6px 20px var(--accent-glow);
            border: none;
            cursor: pointer;
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--accent-glow);
            color: #ffffff;
        }

        .btn-action-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.92rem;
            padding: 0.85rem 1.5rem;
            border-radius: 14px;
            text-decoration: none;
            transition: var(--transition-smooth);
            border: 1px solid var(--border-light);
        }

        .btn-action-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            body {
                padding-top: 4rem !important;
            }
            .top-controls {
                top: 1rem !important;
                right: 1rem !important;
            }
            body[dir="rtl"] .top-controls {
                right: auto !important;
                left: 1rem !important;
            }
            .error-wrapper {
                padding: 2.25rem 1.5rem;
                border-radius: 20px;
            }
            .error-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body class="dark-mode">

    <!-- Ambient Glow Background -->
    <div class="bg-decor"></div>
    <div class="bg-decor-2"></div>

    <!-- ==================== TOP RIGHT FLOATING CONTROLS (OUTSIDE CARD) ==================== -->
    <div class="top-controls">
        <button class="ctrl-btn" id="darkModeBtn" aria-label="Toggle Theme">
            <i class="fas fa-moon" id="themeIcon"></i>
            <span id="themeLabel">Dark</span>
        </button>

        <button class="ctrl-btn" id="rtlBtn" aria-label="Toggle Layout Direction">
            <i class="fas fa-right-left" id="rtlIcon"></i>
            <span id="rtlLabel">RTL</span>
        </button>
    </div>

    <!-- ==================== MAIN 404 CARD ==================== -->
    <div class="error-wrapper">
        <!-- ACADEMY LOGO HEADER -->
        <div style="text-align: center;">
            <a href="index.html" class="logo-area">
                <span class="logo-knight">♞</span>
                <div class="logo-text-block" style="text-align: left;">
                    <span class="logo-title">CHESS ACADEMY</span>
                    <span class="logo-sub">TACTICS &amp; MASTERY</span>
                </div>
            </a>
        </div>

        <!-- 404 CHESS GRAPHIC -->
        <div class="error-illustration">
            <span class="fallen-king">♚</span>
        </div>

        <div>
            <span class="error-badge"><i class="fas fa-triangle-exclamation"></i> ILLEGAL BOARD POSITION</span>
        </div>

        <h1 class="error-title">404 - Checkmate!</h1>
        <p class="error-subtitle">
            The move you attempted to play resulted in an illegal board position. The page you are searching for has been moved, captured, or does not exist.
        </p>

        <!-- ACTION BUTTONS -->
        <div class="actions-group">
            <a href="index.html" class="btn-action-primary">
                <i class="fas fa-house"></i>
                Return to Academy Home
            </a>
            <a href="user dashboard.html" class="btn-action-secondary">
                <i class="fas fa-chess-board"></i>
                Student Dashboard
            </a>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const darkModeBtn = document.getElementById('darkModeBtn');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');

            const rtlBtn = document.getElementById('rtlBtn');
            const rtlLabel = document.getElementById('rtlLabel');

            // 1. Dark / Light Mode Toggle
            function updateThemeUI(isDark) {
                if (isDark) {
                    body.classList.add('dark-mode');
                    if (themeIcon) themeIcon.className = 'fas fa-sun';
                    if (themeLabel) themeLabel.textContent = 'Light';
                    localStorage.setItem('chessacademy_theme', 'dark');
                } else {
                    body.classList.remove('dark-mode');
                    if (themeIcon) themeIcon.className = 'fas fa-moon';
                    if (themeLabel) themeLabel.textContent = 'Dark';
                    localStorage.setItem('chessacademy_theme', 'light');
                }
            }

            const savedTheme = localStorage.getItem('chessacademy_theme');
            updateThemeUI(savedTheme !== 'light');

            if (darkModeBtn) {
                darkModeBtn.addEventListener('click', () => {
                    const isDark = !body.classList.contains('dark-mode');
                    updateThemeUI(isDark);
                });
            }

            // 2. RTL / LTR Toggle
            function updateRTLUI(isRtl) {
                const dir = isRtl ? 'rtl' : 'ltr';
                body.setAttribute('dir', dir);
                document.documentElement.setAttribute('dir', dir);
                if (rtlLabel) rtlLabel.textContent = isRtl ? 'LTR' : 'RTL';
                localStorage.setItem('chessacademy_rtl', dir);
            }

            const savedRtl = localStorage.getItem('chessacademy_rtl');
            updateRTLUI(savedRtl === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    const isRtl = (body.getAttribute('dir') || 'ltr') === 'ltr';
                    updateRTLUI(isRtl);
                });
            }
        });
    </script>
</body>
</html>
