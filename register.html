    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --surface-glass: rgba(255, 255, 255, 0.95);
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #d4a373;
            --accent-hover: #b07d4f;
            --accent-glow: rgba(212, 163, 115, 0.3);
            --border-light: rgba(15, 23, 42, 0.12);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Outfit', sans-serif;
        }

        body.dark-mode {
            --bg-primary: #0d1117;
            --bg-secondary: #131923;
            --surface-glass: rgba(19, 25, 35, 0.95);
            --card-bg: #1a2230;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            padding: 2rem 1rem;
        }

        /* Ambient background decoration */
        .bg-decor {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -150px;
            left: -150px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-decor-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(176, 125, 79, 0.2) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            pointer-events: none;
            z-index: 0;
        }

        /* TOP RIGHT FLOATING CONTROLS (OUTSIDE CARD) */
        .top-controls {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        body[dir="rtl"] .top-controls {
            right: auto;
            left: 2rem;
        }

        .ctrl-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1;
            height: 36px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(12px);
        }

        .ctrl-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* REGISTER CONTAINER */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transition: var(--transition-smooth);
            margin: 0 auto;
        }

        .login-form-box {
            padding: 2.5rem 2.2rem;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 600px) {
            body {
                padding-top: 4rem !important;
            }
            .top-controls {
                top: 1rem !important;
                right: 1rem !important;
            }
            body[dir="rtl"] .top-controls {
                right: auto !important;
                left: 1rem !important;
            }
            .login-wrapper {
                border-radius: 20px;
            }
            .login-form-box {
                padding: 1.75rem 1.25rem;
            }
        }

        /* LEFT SIDE BANNER */
        .login-banner {
            position: relative;
            background: linear-gradient(135deg, rgba(10, 14, 23, 0.92) 0%, rgba(19, 25, 35, 0.96) 100%),
                        url('images/register_hero_portal.jpg') center/cover no-repeat;
            padding: 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            border-right: 1px solid var(--border-light);
        }

        body[dir="rtl"] .login-banner {
            border-right: none;
            border-left: 1px solid var(--border-light);
        }

        .banner-top .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: inherit;
            text-decoration: none !important;
            line-height: 1;
        }

        .logo-knight {
            font-size: 2.3rem;
            color: var(--accent);
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 8px var(--accent-glow));
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .logo-title {
            font-family: var(--font-heading);
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: 1.5px;
            line-height: 1.1;
            background: linear-gradient(135deg, #a06834 0%, #d4a373 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .logo-sub {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 3px;
            line-height: 1;
            margin-top: 2px;
            display: block;
        }

        .banner-mid {
            margin: 2.5rem 0;
        }

        .banner-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 163, 115, 0.2);
            color: #f7d098;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(212, 163, 115, 0.4);
        }

        .banner-headline {
            font-family: var(--font-heading);
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .banner-desc {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .banner-footer {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.75);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding-top: 1.5rem;
        }

        /* RIGHT SIDE FORM */
        .login-form-box {
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .login-form-box {
                padding: 2.2rem 1.5rem;
            }
        }

        .form-header {
            margin-bottom: 1.8rem;
        }

        .form-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }

        .form-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Input Fields */
        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-row-2 {
                grid-template-columns: 1fr;
            }
        }

        .field-group {
            margin-bottom: 1.2rem;
        }

        .field-label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1.1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            pointer-events: none;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        .form-field {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.6rem;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: var(--font-main);
            transition: var(--transition-smooth);
        }

        [dir="rtl"] .form-field {
            padding: 0.8rem 2.6rem 0.8rem 1rem;
        }

        .form-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3.5px var(--accent-glow);
        }

        .toggle-pw {
            position: absolute;
            right: 1.1rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.3rem;
            transition: var(--transition-smooth);
        }

        [dir="rtl"] .toggle-pw {
            right: auto;
            left: 1.1rem;
        }

        .toggle-pw:hover {
            color: var(--accent);
        }

        /* Checkbox Terms */
        .terms-row {
            margin-bottom: 1.4rem;
            font-size: 0.86rem;
        }

        .remember-me {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            line-height: 1.4;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            margin-top: 2px;
            cursor: pointer;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--accent) 0%, #b07d4f 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        /* Back & Account Switch */
        .switch-auth {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .switch-auth a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .switch-auth a:hover {
            text-decoration: underline !important;
        }
    </style>
<style>

<style>
        /* Global Mobile Overflow & Alignment Protection */
        html, body {
            overflow-x: hidden !important;
            width: 100% !important;
            max-width: 100% !important;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .mobile-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 340px;
            max-width: 88vw;
            height: 100vh;
            background: var(--card-bg);
            border-left: 1px solid var(--border-light);
            box-shadow: var(--shadow-lg);
            z-index: 10001;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .mobile-panel.active {
            transform: translateX(0);
        }

        body[dir="rtl"] .mobile-panel {
            right: auto;
            left: 0;
            transform: translateX(-100%);
            border-left: none;
            border-right: 1px solid var(--border-light);
        }

        body[dir="rtl"] .mobile-panel.active {
            transform: translateX(0);
        }
</style>

<body>
    <!-- Ambient Glow Background -->
    <div class="bg-decor"></div>
    <div class="bg-decor-2"></div>

    <!-- ==================== TOP RIGHT OUTSIDE CONTROLS ==================== -->
    <div class="top-controls">
        <button class="ctrl-btn" id="darkModeBtn" aria-label="Toggle Theme">
            <i class="fas fa-moon" id="themeIcon"></i>
            <span id="themeLabel">Dark</span>
        </button>

        <button class="ctrl-btn" id="rtlBtn" aria-label="Toggle Layout Direction">
            <i class="fas fa-right-left" id="rtlIcon"></i>
            <span id="rtlLabel">RTL</span>
        </button>
    </div>

    <!-- ==================== MAIN REGISTER WRAPPER ==================== -->
    <div class="login-wrapper">
        <div class="login-form-box">
            <!-- LOGO HEADER -->
            <div class="card-top-header" style="text-align: center; margin-bottom: 2rem;">
                <a href="index.html" class="logo-area" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: inherit; text-decoration: none;">
                    <span class="logo-knight" style="font-size: 2.3rem; color: var(--accent);">♞</span>
                    <div class="logo-text-block" style="text-align: left;">
                        <span class="logo-title" style="font-family: var(--font-heading); font-weight: 900; font-size: 1.3rem; background: linear-gradient(135deg, #a06834 0%, #d4a373 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: block;">CHESS ACADEMY</span>
                        <span class="logo-sub" style="font-size: 0.68rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 2.8px; display: block;">TACTICS &amp; MASTERY</span>
                    </div>
                </a>
            </div>

            <div class="form-header" style="margin-bottom: 1.8rem; text-align: center;">
                <h2 class="form-title" style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.3rem;">Create Account</h2>
                <p class="form-subtitle" style="color: var(--text-secondary); font-size: 0.92rem;">Fill in your details to register for Grandmaster training</p>
            </div>

            <!-- Registration Form -->
            <form id="registerPortalForm">
                <div class="field-group">
                    <label for="regName" class="field-label">Full Name</label>
                    <div class="input-wrap">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="regName" class="form-field" placeholder="Magnus Carlsen" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="regEmail" class="field-label">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" class="form-field" placeholder="player@chessacademy.com" required>
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="field-group">
                        <label for="regPassword" class="field-label">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="regPassword" class="form-field" placeholder="••••••••" required>
                            <i class="fas fa-eye toggle-pw" id="togglePasswordBtn1"></i>
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="regRating" class="field-label">Current ELO Rating</label>
                        <div class="input-wrap">
                            <i class="fas fa-chart-line input-icon"></i>
                            <input type="text" id="regRating" class="form-field" placeholder="e.g. 1450 or Unrated" required>
                        </div>
                    </div>
                </div>

                <div class="terms-row">
                    <label class="remember-me">
                        <input type="checkbox" id="termsCheck" required>
                        <span>I agree to the <a href="#" style="color: var(--accent); font-weight: 600;">Terms of Service</a> &amp; FIDE Fair Play Guidelines.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Create Academy Account</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- Social Registration Divider & 3 Icons -->
                <div style="display: flex; align-items: center; gap: 1rem; margin: 1.4rem 0; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">
                    <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
                    <span>Or register with</span>
                    <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
                </div>

                <div style="display: flex; justify-content: center; gap: 1rem;">
                    <button type="button" aria-label="Register with Google" onclick="alert('Google registration initiated...')" style="flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--bg-primary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: var(--transition-smooth); box-shadow: var(--shadow-sm);">
                        <i class="fab fa-google"></i>
                    </button>
                    <button type="button" aria-label="Register with GitHub" onclick="alert('GitHub registration initiated...')" style="flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--bg-primary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: var(--transition-smooth); box-shadow: var(--shadow-sm);">
                        <i class="fab fa-github"></i>
                    </button>
                    <button type="button" aria-label="Register with Chess.com" onclick="alert('Chess.com registration initiated...')" style="flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--bg-primary); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: var(--transition-smooth); box-shadow: var(--shadow-sm);">

            <div class="switch-auth">
                <span>Already have an account?</span>
                <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;

            // Elements
            const darkModeBtn = document.getElementById('darkModeBtn');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');

            const rtlBtn = document.getElementById('rtlBtn');
            const rtlLabel = document.getElementById('rtlLabel');

            const togglePasswordBtn1 = document.getElementById('togglePasswordBtn1');
            const regPassword = document.getElementById('regPassword');
            const registerPortalForm = document.getElementById('registerPortalForm');

            // 1. Dark / Light Mode Toggle
            function updateThemeUI(isDark) {
                if (isDark) {
                    body.classList.add('dark-mode');
                    if (themeIcon) themeIcon.className = 'fas fa-sun';
                    if (themeLabel) themeLabel.textContent = 'Light';
                    localStorage.setItem('chessacademy_theme', 'dark');
                } else {
                    body.classList.remove('dark-mode');
                    if (themeIcon) themeIcon.className = 'fas fa-moon';
                    if (themeLabel) themeLabel.textContent = 'Dark';
                    localStorage.setItem('chessacademy_theme', 'light');
                }
            }

            const savedTheme = localStorage.getItem('chessacademy_theme');
            updateThemeUI(savedTheme !== 'light');

            if (darkModeBtn) {
                darkModeBtn.addEventListener('click', () => {
                    const isDark = !body.classList.contains('dark-mode');
                    updateThemeUI(isDark);
                });
            }

            // 2. RTL / LTR Toggle
            function updateRTLUI(isRtl) {
                const dir = isRtl ? 'rtl' : 'ltr';
                body.setAttribute('dir', dir);
                document.documentElement.setAttribute('dir', dir);
                if (rtlLabel) rtlLabel.textContent = isRtl ? 'LTR' : 'RTL';
                localStorage.setItem('chessacademy_rtl', dir);
            }

            const savedRtl = localStorage.getItem('chessacademy_rtl');
            updateRTLUI(savedRtl === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    const isRtl = (body.getAttribute('dir') || 'ltr') === 'ltr';
                    updateRTLUI(isRtl);
                });
            }

            // 3. Password Toggle Eye Icon
            if (togglePasswordBtn1 && regPassword) {
                togglePasswordBtn1.addEventListener('click', () => {
                    const type = regPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                    regPassword.setAttribute('type', type);
                    togglePasswordBtn1.className = type === 'password' ? 'fas fa-eye toggle-pw' : 'fas fa-eye-slash toggle-pw';
                });
            }

            // 4. Submit Handler
            if (registerPortalForm) {
                registerPortalForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('regName').value;
                    alert(`Congratulations ${name}! Your Chess Academy account has been created. Redirecting to login...`);
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>
</html>
